<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WebVado - Open-source web-based FPGA development environment">
    <title>WebVado - FPGA IDE</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components/flow-navigator.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/components/dialog.css">
    <link rel="stylesheet" href="/css/components/waveform.css">
    <link rel="stylesheet" href="/css/codemirror.css">
</head>
<body>
    <!-- Loading Screen overlay: removed by JS on init, or auto-fades after 1s -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading WebVado...</div>
    </div>

    <!-- Main Application Container: visible by default -->
    <div id="app">
        <!-- Title Bar -->
        <div id="titleBar" class="title-bar">
            <div class="title-bar-left">
                <div class="app-icon"></div>
                <span class="title-bar-text" id="titleBarText">WebVado - No Project Open</span>
            </div>
            <div class="title-bar-controls">
                <button class="title-bar-btn" id="minimizeBtn" aria-label="Minimize" title="Minimize">
                    <svg width="12" height="12" viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.5"/></svg>
                </button>
                <button class="title-bar-btn" id="maximizeBtn" aria-label="Maximize" title="Maximize">
                    <svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
                </button>
                <button class="title-bar-btn close" id="closeBtn" aria-label="Close" title="Close">
                    <svg width="12" height="12" viewBox="0 0 12 12"><line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1.5"/></svg>
                </button>
            </div>
        </div>

        <!-- Menu Bar -->
        <div id="menuBar" class="menu-bar" role="menubar">
            <div class="menu" role="menuitem" data-menu="file">
                <span>File</span>
                <div class="dropdown" role="menu">
                    <button class="dropdown-item" data-action="new-project">New Project...</button>
                    <button class="dropdown-item" data-action="open-project">Open Project...</button>
                    <button class="dropdown-item" data-action="save-project">Save Project <span class="shortcut">Ctrl+S</span></button>
                    <div class="dropdown-separator"></div>
                    <button class="dropdown-item" data-action="close-project">Close Project</button>
                    <div class="dropdown-separator"></div>
                    <button class="dropdown-item" data-action="exit">Exit</button>
                </div>
            </div>

            <div class="menu" role="menuitem" data-menu="edit">
                <span>Edit</span>
                <div class="dropdown" role="menu">
                    <button class="dropdown-item" data-action="undo">Undo <span class="shortcut">Ctrl+Z</span></button>
                    <button class="dropdown-item" data-action="redo">Redo <span class="shortcut">Ctrl+Y</span></button>
                    <div class="dropdown-separator"></div>
                    <button class="dropdown-item" data-action="cut">Cut <span class="shortcut">Ctrl+X</span></button>
                    <button class="dropdown-item" data-action="copy">Copy <span class="shortcut">Ctrl+C</span></button>
                    <button class="dropdown-item" data-action="paste">Paste <span class="shortcut">Ctrl+V</span></button>
                    <div class="dropdown-separator"></div>
                    <button class="dropdown-item" data-action="find">Find/Replace <span class="shortcut">Ctrl+F</span></button>
                </div>
            </div>

            <div class="menu" role="menuitem" data-menu="flow">
                <span>Flow</span>
                <div class="dropdown" role="menu">
                    <button class="dropdown-item" data-action="run-synthesis">Run Synthesis</button>
                    <button class="dropdown-item" data-action="run-implementation">Run Implementation</button>
                    <button class="dropdown-item" data-action="generate-bitstream">Generate Bitstream</button>
                    <div class="dropdown-separator"></div>
                    <button class="dropdown-item" data-action="run-simulation">Run Simulation</button>
                </div>
            </div>

            <div class="menu" role="menuitem" data-menu="tools">
                <span>Tools</span>
                <div class="dropdown" role="menu">
                    <button class="dropdown-item" data-action="settings">Settings...</button>
                    <button class="dropdown-item" data-action="check-syntax">Check Syntax</button>
                    <button class="dropdown-item" data-action="compile-order">Report Compile Order</button>
                </div>
            </div>

            <div class="menu" role="menuitem" data-menu="window">
                <span>Window</span>
                <div class="dropdown" role="menu">
                    <button class="dropdown-item" data-action="toggle-flow-nav">Flow Navigator</button>
                    <button class="dropdown-item" data-action="toggle-sources">Sources</button>
                    <button class="dropdown-item" data-action="toggle-console">Console</button>
                    <button class="dropdown-item" data-action="show-summary">Project Summary</button>
                </div>
            </div>

            <div class="menu" role="menuitem" data-menu="help">
                <span>Help</span>
                <div class="dropdown" role="menu">
                    <button class="dropdown-item" data-action="documentation">Documentation</button>
                    <button class="dropdown-item" data-action="about">About WebVado</button>
                    <div class="dropdown-separator"></div>
                    <button class="dropdown-item" data-action="toggle-language">
                        Language / 语言 <span class="current-lang" id="currentLang">EN</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Toolbar -->
        <div id="toolbar" class="toolbar" role="toolbar">
            <button class="toolbar-btn" data-action="save-project" title="Save All (Ctrl+S)" aria-label="Save All">
                <svg width="16" height="16" viewBox="0 0 16 16"><path d="M14 0H2C0.9 0 0 0.9 0 2v12c0 1.1 0.9 2 2 2h12c1.1 0 2-0.9 2-2V2c0-1.1-0.9-2-2-2zM5 2h6v4H5V2zm7 12H4V9h8v5z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="undo" title="Undo (Ctrl+Z)" aria-label="Undo">
                <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3L3 8l5 5V9c3.3 0 6 2.7 6 6 0-4.4-2.6-8-6-8V3z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="redo" title="Redo (Ctrl+Y)" aria-label="Redo">
                <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3l5 5-5 5V9c-3.3 0-6 2.7-6 6 0-4.4 2.6-8 6-8V3z"/></svg>
            </button>

            <div class="toolbar-separator"></div>

            <button class="toolbar-btn" data-action="run-synthesis" title="Run Synthesis" aria-label="Run Synthesis">
                <svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 2v12l10-6z"/></svg>
            </button>
            <button class="toolbar-btn" data-action="run-simulation" title="Run Simulation" aria-label="Run Simulation">
                <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/></svg>
            </button>

            <div class="toolbar-separator"></div>

            <button class="toolbar-btn" data-action="find" title="Find/Replace (Ctrl+F)" aria-label="Find">
                <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 9l5 5" stroke="currentColor" stroke-width="2"/></svg>
            </button>
            <button class="toolbar-btn" data-action="settings" title="Settings" aria-label="Settings">
                <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 4.5c-1.9 0-3.5 1.6-3.5 3.5s1.6 3.5 3.5 3.5 3.5-1.6 3.5-3.5-1.6-3.5-3.5-3.5zm6.1 2.4l-1.4-.9c.1-.4.1-.8 0-1.2l1.4-.9c.3-.2.4-.6.2-.9l-1.5-2.6c-.2-.3-.6-.4-.9-.2l-1.4.9c-.6-.4-1.3-.7-2-.8V.5c0-.3-.3-.5-.5-.5h-3c-.3 0-.5.2-.5.5v1.7c-.7.2-1.4.5-2 .8l-1.4-.9c-.3-.2-.7-.1-.9.2L.5 4.9c-.2.3-.1.7.2.9l1.4.9c-.1.4-.1.8 0 1.2l-1.4.9c-.3.2-.4.6-.2.9l1.5 2.6c.2.3.6.4.9.2l1.4-.9c.6.4 1.3.7 2 .8v1.7c0 .3.2.5.5.5h3c.3 0 .5-.2.5-.5v-1.7c.7-.2 1.4-.5 2-.8l1.4.9c.3.2.7.1.9-.2l1.5-2.6c.2-.3.1-.7-.2-.9z"/></svg>
            </button>

            <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
                <span class="toolbar-label">Status:</span>
                <span class="toolbar-status" id="toolbarStatus">Ready</span>
            </div>        </div>

        <!-- Main Content Area -->
        <div id="mainContainer" class="main-container">
            <!-- Flow Navigator (Left Sidebar) -->
            <aside id="flowNavigator" class="flow-navigator" role="navigation" aria-label="Flow Navigator">
                <div class="panel-header">
                    <span>Flow Navigator</span>
                    <button class="panel-header-btn" data-action="toggle-flow-nav" aria-label="Hide Flow Navigator">«</button>
                </div>
                <div class="flow-nav-content" id="flowNavContent">
                    <!-- Populated by JavaScript -->
                </div>
            </aside>

            <!-- Center Panel -->
            <div class="center-panel">
                <!-- Sources Panel -->
                <div class="sources-panel" id="sourcesPanel">
                    <div class="panel-header">
                        <span>Sources</span>
                        <button class="panel-header-btn" data-action="toggle-sources" aria-label="Hide Sources">
                            <svg width="12" height="12" viewBox="0 0 12 12"><line x1="2" y1="2" x2="10" y2="10" stroke="currentColor" stroke-width="1.5"/><line x1="10" y1="2" x2="2" y2="10" stroke="currentColor" stroke-width="1.5"/></svg>
                        </button>
                    </div>
                    <div class="tab-bar" role="tablist">
                        <button class="tab active" role="tab" data-tab="sources">Sources</button>
                        <button class="tab" role="tab" data-tab="netlist">Netlist</button>
                        <button class="tab" role="tab" data-tab="compile-order">Compile Order</button>
                    </div>
                    <div class="sources-toolbar">
                        <button class="sources-toolbar-btn" data-action="add-sources" title="Add Sources" aria-label="Add Sources">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2"/></svg>
                        </button>
                        <button class="sources-toolbar-btn" data-action="refresh-sources" title="Refresh" aria-label="Refresh">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M14 8c0 3.3-2.7 6-6 6s-6-2.7-6-6h2c0 2.2 1.8 4 4 4s4-1.8 4-4-1.8-4-4-4V2c3.3 0 6 2.7 6 6z"/><path d="M5 4L8 7 5 10V4z"/></svg>
                        </button>
                        <button class="sources-toolbar-btn" data-action="search-sources" title="Search" aria-label="Search">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="2"/><line x1="9" y1="9" x2="14" y2="14" stroke="currentColor" stroke-width="2"/></svg>
                        </button>
                    </div>
                    <div class="sources-tree" id="sourcesTree" role="tree">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>

                <!-- Editor Area -->
                <div class="editor-area">
                    <div class="editor-tabs" id="editorTabs" role="tablist">
                        <!-- Populated by JavaScript -->
                    </div>
                    <div class="editor-body" id="editorBody">
                        <div class="welcome-screen" id="welcomeScreen">
                            <h2>Welcome to WebVado</h2>
                            <p>Open-source FPGA Development Environment</p>
                            <div class="welcome-actions">
                                <button class="btn btn-primary" data-action="new-project">Create New Project</button>
                                <button class="btn" data-action="open-project">Open Existing Project</button>
                            </div>
                            <div class="welcome-links">
                                <a href="#" data-action="documentation">
                                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" style="vertical-align:middle;margin-right:4px"><path d="M2 0C0.9 0 0 0.9 0 2v12c0 1.1 0.9 2 2 2h12c1.1 0 2-0.9 2-2V2c0-1.1-0.9-2-2-2H2zm0 2h12v12H2V2zm2 2v1h8V4H4zm0 2v1h8V6H4zm0 2v1h6V8H4z"/></svg>
                                    Documentation
                                </a>
                                <a href="#" data-action="examples">
                                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" style="vertical-align:middle;margin-right:4px"><path d="M0 2C0 0.9 0.9 0 2 0h4l2 2h6c1.1 0 2 0.9 2 2v10c0 1.1-0.9 2-2 2H2c-1.1 0-2-0.9-2-2V2z"/></svg>
                                    Example Projects
                                </a>
                                <a href="https://github.com/yourusername/webvado" target="_blank">
                                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" style="vertical-align:middle;margin-right:4px"><path d="M8 0C3.6 0 0 3.6 0 8c0 3.5 2.3 6.5 5.5 7.6.4.1.5-.2.5-.4v-1.4c-2.2.5-2.7-1.1-2.7-1.1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.2 1.9.9 2.3.7.1-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-3.9 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8.6-.2 1.3-.3 2-.3.7 0 1.4.1 2 .3 1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.5.8 1.2.8 2.1 0 3-1.8 3.7-3.6 3.9.3.2.5.7.5 1.4v2c0 .2.1.5.5.4C13.7 14.5 16 11.5 16 8c0-4.4-3.6-8-8-8z"/></svg>
                                    GitHub Repository
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Console Panel -->
        <div class="console-panel" id="consolePanel">
            <div class="console-tabs" role="tablist">
                <button class="console-tab active" role="tab" data-tab="tcl-console">Tcl Console</button>
                <button class="console-tab" role="tab" data-tab="messages">Messages</button>
                <button class="console-tab" role="tab" data-tab="logs">Logs</button>
                <button class="console-tab" role="tab" data-tab="reports">Reports</button>
            </div>
            <div class="console-toolbar">
                <button class="console-toolbar-btn" data-action="clear-console" title="Clear" aria-label="Clear Console">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M2 4h12M5 4V2h6v2M6 6v6M8 6v6M10 6v6M4 4v10c0 1.1 0.9 2 2 2h4c1.1 0 2-0.9 2-2V4" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
                </button>
                <button class="console-toolbar-btn" data-action="scroll-bottom" title="Scroll to Bottom" aria-label="Scroll to Bottom">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 12V2M4 9l4 4 4-4M2 14h12" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                </button>
                <button class="console-toolbar-btn" data-action="find-in-console" title="Find" aria-label="Find in Console">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" stroke-width="2"/><line x1="9" y1="9" x2="14" y2="14" stroke="currentColor" stroke-width="2"/></svg>
                </button>
            </div>
            <div class="console-body" id="consoleBody">
                <!-- Populated by JavaScript -->
            </div>
            <div class="console-input-row">
                <span class="console-prompt">WebVado%</span>
                <input type="text" class="console-input" id="consoleInput" placeholder="Type a command here" aria-label="Console Command Input">
            </div>
        </div>

        <!-- Status Bar -->
        <div id="statusBar" class="status-bar" role="status">
            <span id="statusBarText">Ready</span>
            <span class="status-bar-separator">|</span>
            <span id="statusBarProject">No Project Open</span>
            <span class="status-bar-separator">|</span>
            <span id="statusBarPart">-</span>
            <span class="status-bar-separator">|</span>
            <span id="statusBarTime">00:00:00</span>
        </div>
    </div>

    <!-- Dialogs Container -->
    <div id="dialogsContainer"></div>

    <!-- Fallback: if modules fail to load, auto-hide loading screen -->
    <script>
      // If main.js module hasn't run within 2 seconds, hide the loading screen
      window.__wvFallback = setTimeout(function() {
        var ls = document.getElementById('loadingScreen');
        if (ls) ls.style.display = 'none';
      }, 2000);
    </script>

    <!-- Main module -->
    <script type="module" src="/js/main.js"></script>
</body>
</html>
