<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>错误检测页面</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        .error { background: #ff0000; color: white; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #00ff00; color: black; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .log { background: #2d2d30; padding: 5px; margin: 2px 0; border-left: 3px solid #007acc; }
    </style>
</head>
<body>
    <h1>JavaScript 错误检测</h1>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');
        
        // 捕获所有错误
        window.addEventListener('error', (e) => {
            const div = document.createElement('div');
            div.className = 'error';
            div.innerHTML = `
                <strong>ERROR:</strong> ${e.message}<br>
                <strong>File:</strong> ${e.filename}<br>
                <strong>Line:</strong> ${e.lineno}:${e.colno}<br>
                <strong>Stack:</strong> ${e.error ? e.error.stack : 'N/A'}
            `;
            output.appendChild(div);
        });

        // 捕获未处理的 Promise 错误
        window.addEventListener('unhandledrejection', (e) => {
            const div = document.createElement('div');
            div.className = 'error';
            div.innerHTML = `
                <strong>UNHANDLED PROMISE REJECTION:</strong><br>
                ${e.reason}
            `;
            output.appendChild(div);
        });

        function log(msg, isSuccess = false) {
            const div = document.createElement('div');
            div.className = isSuccess ? 'success' : 'log';
            div.textContent = msg;
            output.appendChild(div);
        }

        log('Starting module test...');

        // 尝试加载模块
        import('/js/core/EventBus.js')
            .then(module => {
                log('✓ EventBus loaded', true);
                return import('/js/api/APIClient.js');
            })
            .then(module => {
                log('✓ APIClient loaded', true);
                return import('/js/components/Dialog.js');
            })
            .then(module => {
                log('✓ Dialog loaded', true);
                return import('/js/components/dialogs/NewProjectDialog.js');
            })
            .then(module => {
                log('✓ NewProjectDialog loaded', true);
                return import('/js/main.js');
            })
            .then(module => {
                log('✓ main.js loaded', true);
                log('✓✓✓ ALL MODULES LOADED SUCCESSFULLY ✓✓✓', true);
                
                // 检查 window.webvado
                setTimeout(() => {
                    if (window.webvado) {
                        log('✓ window.webvado exists', true);
                        log(`window.webvado.initialized = ${window.webvado.initialized}`);
                        
                        // 测试点击事件
                        log('Testing click on New Project menu item...');
                        const newProjectBtn = document.querySelector('[data-action="new-project"]');
                        if (newProjectBtn) {
                            log('✓ Found New Project button', true);
                            newProjectBtn.click();
                        } else {
                            log('✗ New Project button NOT FOUND in DOM');
                        }
                    } else {
                        log('✗ window.webvado NOT FOUND');
                    }
                }, 1000);
            })
            .catch(err => {
                log(`✗ MODULE LOAD FAILED: ${err.message}`);
                log(`Stack: ${err.stack}`);
            });
    </script>

    <!-- 加载实际的菜单 HTML 用于测试 -->
    <div style="margin-top: 50px; background: white; padding: 20px; color: black;">
        <h2>测试菜单</h2>
        <button class="dropdown-item" data-action="new-project" 
                style="padding: 10px 20px; cursor: pointer; background: #1888e8; color: white; border: none; border-radius: 4px;">
            New Project
        </button>
    </div>

    <script type="module">
        // 这里会实际执行 main.js 的初始化
        import('/js/main.js').then(() => {
            console.log('main.js module executed');
        });
    </script>
</body>
</html>
